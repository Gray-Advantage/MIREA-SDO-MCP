[project]
name = "mirea-sdo-mcp"
version = "0.2.1"
description = "MCP-сервер для СДО РТУ МИРЭА (Moodle): дисциплины, материалы, файлы, задания и оценки — только на чтение"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "moodle", "mirea", "sdo"]
authors = [
    { name = "Gray_Advantage", email = "sergeyindra@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "mcp[cli]>=1.2",
    "openpyxl>=3.1.5",
    "playwright>=1.48",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
mirea-sdo-mcp = "mirea_sdo_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
